name: Microservices CI Pipeline

# 1. Триггер: Запускать на любой Push в ветку main или master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. Задачи (Jobs)
jobs:
  check-quality:
    runs-on: ubuntu-latest # Арендуем виртуальную машину Linux

    steps:
    # Шаг А: Скачиваем наш код из репозитория
    - name: Checkout code
      uses: actions/checkout@v3

    # Шаг Б: Устанавливаем Python
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    # Шаг В: Устанавливаем библиотеки
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Шаг Г:

    # Шаг Д: Запускаем тесты
    - name: Run Unit Tests
      run: |
        # Указываем python path, чтобы тесты видели папки сервисов
        export PYTHONPATH=$PYTHONPATH:.
        pytest
